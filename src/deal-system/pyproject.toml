[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caldova-deal-system"
version = "0.1.0"
description = "Caldova Deal System: local system of record with REST, MCP and a browser approval page (fictional sample data)"
requires-python = ">=3.11"
dependencies = [
    "caldova-pricing",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3,<3",
    "python-docx>=1.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["caldova_deal_system", "caldova_deal_system.templates"]

[tool.setuptools.package-data]
"caldova_deal_system.templates" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
